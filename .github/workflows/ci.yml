---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
