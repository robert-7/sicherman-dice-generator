---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Check formatting (Prettier)
        run: npm run format:check
      # Runs the Vitest suite under v8 coverage and fails if any metric drops
      # below the 100% thresholds configured in vite.config.ts.
      - name: Test with coverage (100% gate)
        run: npm run coverage
      # `build` runs `tsc --noEmit` (type check) before `vite build`.
      - name: Build
        run: npm run build
