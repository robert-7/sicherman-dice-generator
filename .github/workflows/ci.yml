---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Check formatting (Prettier)
        run: npm run format:check
      # Runs the Vitest suite under v8 coverage and fails if any metric drops
      # below the 100% thresholds configured in vite.config.ts.
      - name: Test with coverage (100% gate)
        run: npm run coverage
      # `build` runs `tsc --noEmit` (type check) before `vite build`.
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # playwright.config.ts brings up the full Docker Compose stack (nginx +
      # FastAPI) itself and tears it down once the run finishes.
      - name: Run end-to-end tests
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
      # Safety net: Playwright stops the webServer it started, but make sure no
      # containers linger if a run times out or is cancelled mid-test.
      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose -f ../docker-compose.yml down
